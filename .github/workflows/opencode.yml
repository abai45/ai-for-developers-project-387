name: opencode

# Интерактивный вызов агента из комментариев.
# Событие ещё не означает вызова модели: фильтр `if` отсекает комментарии
# без команды, от ботов и от недоверенных авторов ДО работы агента; шаг
# «Предел запусков» останавливает прогон до вызова модели, когда бюджет
# треда исчерпан.
on:
  issue_comment:
    types: [created] # только создание: правка комментария не перезапускает
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    # Команда в тексте + доверенный автор + комментарии ботов игнорируются.
    # Набор команд — по умолчанию: /opencode и /oc (параметр mentions не задан).
    if: |
      (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')) &&
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    # 30 минут: implement-spec на раннере (TypeSpec-генерация, тесты, линтер)
    # не укладывается в 15.
    timeout-minutes: 30
    # Один активный прогон на issue/PR: новый вызов отменяет текущий
    # (cancel-in-progress). На уровне задания, а не воркфлоу: пропущенный по
    # фильтру запуск (например, собственный ответ агента) не отменяет работающий.
    concurrency:
      group: opencode-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    # Стандартный режим OpenCode: чтение репозитория + OIDC-обмен на токен
    # GitHub App (им правами агент комментирует и пушит).
    # pull-requests: read — проверка head-репозитория PR (не fork ли он);
    # issues: write — триаж и отчёты: gh из сессии вешает метки, шаги gate
    # публикуют итоги без модели;
    # actions: read — бюджет-гейт считает попытки по истории Actions.
    permissions:
      contents: read
      id-token: write
      pull-requests: read
      issues: write
      actions: read
    steps:
      # Секрет модели не должен попасть в прогон по недоверенному fork:
      # PR из чужого репозитория не запускаем вовсе.
      - name: "Проверка: PR не из fork"
        id: guard
        uses: actions/github-script@v7
        with:
          script: |
            let fork = false;
            const prNumber = context.payload.issue?.pull_request
              ? context.payload.issue.number
              : context.payload.pull_request?.number;
            if (prNumber && context.payload.issue?.pull_request) {
              const pr = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });
              fork = pr.data.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`;
            } else if (prNumber) {
              const pr = context.payload.pull_request;
              fork = pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`;
            }
            core.setOutput('safe', fork ? 'false' : 'true');
            if (fork) core.info('PR из fork — прогон остановлен, секрет не используется');

      # Предел запусков на тред (issue/PR): считаем допущенные запросы человека
      # к модели — каждый непропущенный прогон этого воркфлоу по тому же треду,
      # включая попытки Re-run (run_attempt), отмены и таймауты. Источник
      # счёта — история Actions, токен агента её не перезаписывает. Превышение:
      # модель не вызывается, итог публикует шаг без модели.
      - name: "Предел запусков: бюджет треда"
        id: budget
        if: steps.guard.outputs.safe == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const limit = 3;
            // Идентичность треда — номер issue/PR (устойчив к переименованию
            // и не смешивает одноимённые треды). Два независимых счёта:
            // 1) допущенные человеком запросы /oc в этом треде (комментарии
            //    ботов не считаются — отказ limit_exhausted не тратит бюджет);
            // 2) история Actions этого воркфлоу: непропущенные прогоны того же
            //    заголовка, Re-run считается по run_attempt (отмены/таймауты —
            //    попытки). Взяли родство max: переименование треда обнуляет
            //    только историю-сторону, комментарии остаются.
            const num = context.payload.issue?.number ?? context.payload.pull_request?.number;
            const humans = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: num,
              per_page: 100,
            });
            const spendComments = humans.filter(
              (c) =>
                c.user?.type !== 'Bot' &&
                (c.body?.includes('/oc') || c.body?.includes('/opencode')),
            ).length;
            const threadTitle = context.payload.issue?.title ?? context.payload.pull_request?.title ?? '';
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'opencode.yml',
              per_page: 100,
            });
            const spendHistory = runs
              .filter(
                (r) =>
                  r.display_title === threadTitle &&
                  (r.event === 'issue_comment' || r.event === 'pull_request_review_comment') &&
                  r.conclusion !== 'skipped',
              )
              .reduce((s, r) => s + (r.run_attempt || 1), 0);
            const spent = Math.max(spendComments, spendHistory);
            core.info(
              `Бюджет треда #${num}: комментарии=${spendComments}, история=${spendHistory}, считаем ${spent} из ${limit}`,
            );
            core.setOutput('spent', String(spent));
            core.setOutput('allowed', spent <= limit ? 'true' : 'false');
            core.setOutput('limit', String(limit));

      - name: "Отказ: бюджет исчерпан (без модели)"
        if: steps.guard.outputs.safe == 'true' && steps.budget.outputs.allowed == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const num = context.payload.issue?.number ?? context.payload.pull_request?.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: num,
              body: [
                '**limit_exhausted** — вызов модели не выполнен, бюджет треда исчерпан.',
                `Попыток (с Re-run, отменами и таймаутами): ${process.env.SPENT}, лимит: ${process.env.LIMIT} на этот PR/issue.`,
                `Head на момент отказа: \`${process.env.SHA}\`.`,
                `Логи: ${process.env.RUN_URL} — дальше действует человек: изменить объём, открыть новый PR (бюджет нового треда не связан с этим) или доделать вручную.`,
              ].join('\n'),
            });
        env:
          SPENT: ${{ steps.budget.outputs.spent }}
          LIMIT: ${{ steps.budget.outputs.limit }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Checkout repository
        if: steps.guard.outputs.safe == 'true' && steps.budget.outputs.allowed == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          # Стандартный режим: git-доступ даёт токен GitHub App, а не checkout
          persist-credentials: false

      # Окружение проекта на раннере: агенту нужны mise (java temurin-21, node 22)
      # для контрактной цепочки `mise run spec` и точечных проверок. Полный
      # `mise run check` остаётся арбитражем CI на ветке PR.
      - name: Установка mise (инструменты проекта)
        if: steps.guard.outputs.safe == 'true' && steps.budget.outputs.allowed == 'true'
        uses: jdx/mise-action@v2
        with:
          install: true

      # Раннер начинает с чистого окружения: глобальные скиллы первой проектной
      # сессии (triage, to-spec, to-tickets) ставим отдельно. Проектные (implement-spec
      # и др.) лежат в .agents/skills/ и едут с репозиторием.
      - name: Установка Node для skills CLI
        if: steps.guard.outputs.safe == 'true' && steps.budget.outputs.allowed == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Установка скиллов triage, to-spec и to-tickets
        if: steps.guard.outputs.safe == 'true' && steps.budget.outputs.allowed == 'true'
        run: npx -y skills add mattpocock/skills --skill triage --skill to-spec --skill to-tickets -a opencode -g -y

      - name: Run OpenCode
        id: run_opencode
        if: steps.guard.outputs.safe == 'true' && steps.budget.outputs.allowed == 'true'
        uses: anomalyco/opencode/github@latest
        env:
          # Ключ провайдера — только из Secrets, в git не хранится
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          # Чтение issue из сессии агента (gh CLI)
          GH_TOKEN: ${{ github.token }}
        with:
          # Провайдер OpenCode (Console «Hexlet Students»), модель без списаний
          model: opencode/mimo-v2.6-flash-free
          # Решение для открытого репозитория: сессии агента не публикуются
          share: "false"

      # Итоги без модели: человек видит причину по комментарию,
      # а не по косвенным признакам. Новый PR получает новый бюджет.
      - name: "Итог: infra (сбой подготовки или гейта, без модели)"
        if: failure() && steps.guard.outputs.safe == 'true' && steps.run_opencode.outcome != 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const num = context.payload.issue?.number ?? context.payload.pull_request?.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: num,
              body: [
                '**infra** — прогон упал на подготовке окружения до/вне агента (checkout, mise, скиллы).',
                `Head: \`${process.env.SHA}\`. Логи: ${process.env.RUN_URL}`,
              ].join('\n'),
            });
        env:
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: "Итог: agent_failed (агент вернул ошибку)"
        if: failure() && steps.run_opencode.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const num = context.payload.issue?.number ?? context.payload.pull_request?.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: num,
              body: [
                '**agent_failed** — сессия агента завершилась ошибкой (не таймаут, не подготовка).',
                `Head: \`${process.env.SHA}\`. Логи: ${process.env.RUN_URL}. Неясную причину смотреть в логах прогона; следующий шаг выбирает человек.`,
              ].join('\n'),
            });
        env:
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: "Итог: timeout (прогон снят по limit)"
        if: cancelled() && steps.budget.outputs.allowed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const num = context.payload.issue?.number ?? context.payload.pull_request?.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: num,
              body: [
                '**timeout** — прогон отменён (таймаут задания или отмена новым вызовом того же треда).',
                `Head: \`${process.env.SHA}\`. Логи: ${process.env.RUN_URL}`,
              ].join('\n'),
            });
        env:
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
